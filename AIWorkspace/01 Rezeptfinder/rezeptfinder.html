<title>01 Rezeptfinder</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: eine schmale Daumenspalte. Oben die Suchmaske als Karte, darunter Vorschläge als tippbare Liste, darunter das Rezept-Sheet mit gemaltem Teller */
:root {
  --bg: #f8f1ec; --sheet: #fffaf6; --ink: #2a1a15; --muted: #7b6158; --line: #ead9cf;
  --tomato: #c23a1e; --tomato-soft: #fbe3da; --basil: #3d6a35; --basil-soft: #e2eedb;
  --parm: #9a6a14; --parm-soft: #f7ebcf; --chip: #f3e6dd; --on-accent: #fff;
  --shadow: 0 8px 30px rgba(60, 25, 10, .10);
  --display: "Bricolage Grotesque", "Avenir Next Condensed", "Arial Narrow", system-ui, sans-serif;
  --body: "Figtree", "Segoe UI", system-ui, -apple-system, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #17110f; --sheet: #211816; --ink: #f5e9e2; --muted: #b9a198; --line: #3a2b26;
    --tomato: #f06c4c; --tomato-soft: #43201a; --basil: #94c486; --basil-soft: #22301f;
    --parm: #e6b85c; --parm-soft: #3a2e17; --chip: #2e2320; --on-accent: #1b0f0b; --shadow: 0 8px 30px rgba(0,0,0,.45);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #17110f; --sheet: #211816; --ink: #f5e9e2; --muted: #b9a198; --line: #3a2b26;
  --tomato: #f06c4c; --tomato-soft: #43201a; --basil: #94c486; --basil-soft: #22301f;
  --parm: #e6b85c; --parm-soft: #3a2e17; --chip: #2e2320; --on-accent: #1b0f0b; --shadow: 0 8px 30px rgba(0,0,0,.45);
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 16.5px; line-height: 1.55; -webkit-font-smoothing: antialiased; }
.page {
  max-width: 600px; margin: 0 auto; display: grid; gap: 22px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 22px 48px;
}
h1, h2, h3 { font-family: var(--display); font-weight: 800; letter-spacing: -.015em; margin: 0; text-wrap: balance; line-height: 1.08; }
.brand { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.brand h1 { font-size: clamp(1.9rem, 8vw, 2.5rem); font-variation-settings: "opsz" 96; }
.brand h1 em { font-style: normal; color: var(--tomato); }
.brand p { margin: 0; color: var(--muted); font-size: 14px; }
.mode { font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); white-space: nowrap; }
.mode.ai { color: var(--basil); }

/* Suchmaske */
.form { background: var(--sheet); border-radius: 24px; padding: 18px; box-shadow: var(--shadow); display: grid; gap: 18px; }
.search { position: relative; }
.search svg { position: absolute; left: 14px; top: 50%; width: 20px; height: 20px; margin-top: -10px; color: var(--muted); pointer-events: none; }
.search input {
  width: 100%; min-height: 54px; border-radius: 16px; border: 1.5px solid var(--line); background: var(--bg); color: var(--ink);
  font: 500 17px var(--body); padding: 0 14px 0 44px;
}
.search input:focus { outline: none; border-color: var(--tomato); box-shadow: 0 0 0 3px var(--tomato-soft); }
.quick { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
.quick button { border: 0; background: var(--chip); color: var(--ink); border-radius: 999px; padding: 6px 12px; font: 500 13.5px var(--body); cursor: pointer; }
.field { display: grid; gap: 8px; }
.label { font-size: 12.5px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.row { display: flex; gap: 14px; flex-wrap: wrap; align-items: end; justify-content: space-between; }
.chips { display: flex; flex-wrap: wrap; gap: 7px; }
.chip {
  min-height: 38px; padding: 0 13px; border-radius: 999px; border: 1.5px solid var(--line); background: transparent; color: var(--ink);
  font: 600 14px var(--body); cursor: pointer; display: inline-flex; align-items: center; gap: 6px;
}
.chip[aria-pressed="true"] { background: var(--tomato-soft); border-color: var(--tomato); color: var(--tomato); }
.chip.diet[aria-pressed="true"] { background: var(--basil-soft); border-color: var(--basil); color: var(--basil); }
.chip[aria-pressed="true"]::before { content: "✓"; font-size: 12px; }
select {
  min-height: 44px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--bg); color: var(--ink);
  font: 600 15px var(--body); padding: 0 12px;
}
.stepper { display: inline-flex; align-items: center; background: var(--chip); border-radius: 999px; padding: 4px; gap: 2px; }
.stepper button {
  width: 40px; height: 40px; border-radius: 50%; border: 0; background: var(--sheet); color: var(--ink);
  font: 600 21px/1 var(--body); cursor: pointer; display: grid; place-items: center; box-shadow: 0 1px 2px rgba(0,0,0,.08);
}
.stepper button:disabled { opacity: .35; cursor: default; }
.stepper output { min-width: 86px; text-align: center; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.1; }
.stepper output small { display: block; font-size: 11px; font-weight: 500; color: var(--muted); }
.go {
  min-height: 54px; border-radius: 16px; border: 0; background: var(--tomato); color: var(--on-accent);
  font: 700 17px var(--body); cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px;
}
.go:disabled { opacity: .6; cursor: progress; }

/* Status */
.status { border-radius: 16px; padding: 14px 16px; background: var(--chip); font-size: 15px; display: flex; gap: 12px; align-items: center; }
.status.warn { background: var(--tomato-soft); }
.status .btnlink { margin-left: auto; }
.spin { width: 20px; height: 20px; border-radius: 50%; border: 2.5px solid var(--line); border-top-color: var(--tomato); animation: spin .8s linear infinite; flex: none; }
@keyframes spin { to { transform: rotate(360deg); } }
.bar { height: 4px; background: var(--line); border-radius: 4px; overflow: hidden; margin-top: 6px; }
.bar i { display: block; height: 100%; width: 0; background: var(--tomato); transition: width .3s; }
.btnlink { border: 0; background: none; color: var(--tomato); font: 700 14.5px var(--body); cursor: pointer; padding: 6px 0; }

/* Vorschläge */
.sugg h2, .rec h2 { font-size: 1.45rem; font-variation-settings: "opsz" 48; }
.sugg { display: grid; gap: 12px; }
.slist { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.scard {
  width: 100%; text-align: left; border: 1.5px solid var(--line); background: var(--sheet); color: var(--ink); border-radius: 20px;
  padding: 12px; font: inherit; cursor: pointer; display: grid; grid-template-columns: 64px minmax(0, 1fr) 20px; gap: 14px; align-items: center;
}
.scard:hover { border-color: var(--tomato); }
.scard[aria-current="true"] { border-color: var(--tomato); background: var(--tomato-soft); }
.scard canvas { width: 64px; height: 64px; border-radius: 50%; display: block; }
.scard b { font-family: var(--display); font-size: 1.12rem; font-weight: 800; display: block; line-height: 1.2; }
.scard .d { font-size: 14px; color: var(--muted); display: block; margin-top: 2px; }
.meta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.meta span { font-size: 12px; font-weight: 600; padding: 1px 8px; border-radius: 6px; background: var(--chip); color: var(--muted); font-variant-numeric: tabular-nums; }
.meta .why { background: var(--basil-soft); color: var(--basil); }
.scard .arr { color: var(--muted); }

/* Rezept */
.rec { background: var(--sheet); border-radius: 26px; overflow: hidden; box-shadow: var(--shadow); }
.hero { aspect-ratio: 16 / 10; width: 100%; max-width: 100%; display: block; background: #3a271f; }
.rbody { padding: 22px 18px 28px; display: grid; gap: 30px; }
@media (min-width: 560px) { .rbody { padding: 26px 28px 32px; } }
.eyebrow { font-size: 12.5px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--tomato); margin: 0 0 8px; }
.rec h2.title { font-size: clamp(1.8rem, 7.6vw, 2.5rem); line-height: 1.04; font-variation-settings: "opsz" 96; }
.lede { margin: 10px 0 0; color: var(--muted); }
.facts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); margin-top: 20px; border: 1px solid var(--line); border-radius: 18px; }
.fact { padding: 13px 6px 11px; text-align: center; display: grid; gap: 3px; justify-items: center; min-width: 0; }
.fact + .fact { border-left: 1px solid var(--line); }
.fact svg { width: 22px; height: 22px; color: var(--tomato); }
.fact b { font-family: var(--display); font-size: 1.15rem; font-weight: 800; line-height: 1.1; font-variant-numeric: tabular-nums; }
.fact span { font-size: 12.5px; color: var(--muted); }
.dots { display: inline-flex; gap: 4px; margin-top: 3px; }
.dots i { width: 7px; height: 7px; border-radius: 50%; background: var(--line); }
.dots i.on { background: var(--tomato); }
.timeline { margin: 10px 0 0; font-size: 13.5px; color: var(--muted); text-align: center; font-variant-numeric: tabular-nums; }
.sec-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
.rec h3 { font-size: 1.4rem; font-variation-settings: "opsz" 48; }
.ings { list-style: none; margin: 0; padding: 0; }
.ings li { display: grid; grid-template-columns: 6.6em minmax(0, 1fr); gap: 12px; align-items: baseline; padding: 10px 0; border-bottom: 1px dashed var(--line); }
.ings li:last-child { border-bottom: 0; }
.qty { font-weight: 700; font-variant-numeric: tabular-nums; text-align: right; }
.qty.none { color: var(--muted); font-weight: 500; }
.iname { min-width: 0; overflow-wrap: anywhere; }
.iname .note { color: var(--muted); font-size: 14px; }
.tag { display: inline-block; vertical-align: 2px; margin-left: 6px; padding: 1px 7px; border-radius: 6px; font-size: 11px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; background: var(--parm-soft); color: var(--parm); }
.tag.bad { background: var(--tomato); color: var(--on-accent); }
.alert { border-radius: 16px; padding: 14px 16px; background: var(--tomato); color: var(--on-accent); font-weight: 600; }
.allergy { border-radius: 20px; background: var(--tomato-soft); padding: 18px; }
.allergy h3 { font-size: 1.15rem; display: flex; gap: 10px; align-items: center; }
.allergy h3 svg { width: 22px; height: 22px; color: var(--tomato); flex: none; }
.allergy dl { margin: 12px 0 0; display: grid; gap: 12px; }
.allergy dt { font-weight: 700; }
.allergy dd { margin: 2px 0 0; font-size: 15px; opacity: .88; }
.allergy .eu { margin: 14px 0 0; font-size: 13px; color: var(--muted); }
.steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.step {
  width: 100%; display: grid; grid-template-columns: 38px minmax(0, 1fr); gap: 14px; text-align: left; border: 1px solid var(--line);
  background: transparent; color: var(--ink); border-radius: 18px; padding: 14px 14px 14px 12px; font: inherit; cursor: pointer;
}
.step .n { width: 38px; height: 38px; border-radius: 50%; background: var(--tomato); color: var(--on-accent); font: 800 1.1rem/38px var(--display); text-align: center; }
.step .t { min-width: 0; }
.step .t strong { display: block; margin-bottom: 2px; }
.step .time { display: inline-block; margin-top: 6px; font-size: 12.5px; font-weight: 600; color: var(--muted); background: var(--chip); padding: 1px 8px; border-radius: 6px; }
.step[aria-pressed="true"] { background: var(--basil-soft); border-color: transparent; }
.step[aria-pressed="true"] .n { background: var(--basil); font-size: 0; }
.step[aria-pressed="true"] .n::after { content: "✓"; font-size: 1.05rem; }
.step[aria-pressed="true"] .t { opacity: .6; }
.hint { font-size: 13.5px; color: var(--muted); margin: 10px 0 0; }
.nutri { display: grid; grid-template-columns: repeat(auto-fit, minmax(96px, 1fr)); border-top: 1px solid var(--line); }
.nutri div { padding: 11px 4px; border-bottom: 1px solid var(--line); }
.nutri b { display: block; font-family: var(--display); font-size: 1.25rem; font-weight: 800; font-variant-numeric: tabular-nums; }
.nutri span { font-size: 13px; color: var(--muted); }
.foot { font-size: 12.5px; color: var(--muted); margin: 0; }
.foot a, .src a { color: var(--tomato); font-weight: 600; }
.sub { margin: -6px 0 0; font-size: 14px; color: var(--muted); }
.src { margin: 8px 0 0; font-size: 14px; color: var(--muted); }
.save { margin-top: 16px; display: grid; gap: 8px; }
.savebtn {
  min-height: 50px; border-radius: 14px; border: 1.5px solid var(--ink); background: var(--ink); color: var(--sheet);
  font: 700 15.5px var(--body); cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; text-decoration: none; padding: 0 16px;
}
.savebtn.done { background: var(--basil-soft); border-color: var(--basil); color: var(--basil); }
.savebtn.ghost { background: transparent; color: var(--ink); }
.savebtn:disabled { opacity: .6; cursor: progress; }
.savebtn:focus-visible { outline: 3px solid var(--tomato); outline-offset: 2px; }
.savemsg { font-size: 14px; color: var(--muted); margin: 0; }
.savemsg.warn { color: var(--tomato); font-weight: 600; }
.savemsg a { color: var(--tomato); font-weight: 600; }
.coverin {
  width: 100%; min-height: 44px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--bg); color: var(--ink);
  font: 14.5px var(--body); padding: 0 12px;
}
.coverin:focus { outline: none; border-color: var(--tomato); box-shadow: 0 0 0 3px var(--tomato-soft); }
.book { display: grid; gap: 14px; }
.book h2 { font-size: 1.45rem; font-variation-settings: "opsz" 48; }
.kat { display: grid; gap: 8px; }
.kat h3 { font-size: 1.1rem; display: flex; align-items: baseline; gap: 8px; }
.kat h3 span { font: 600 13px var(--body); color: var(--muted); font-variant-numeric: tabular-nums; }
.bitem { position: relative; }
.bitem .scard { padding-right: 52px; grid-template-columns: 64px minmax(0, 1fr); }
.bdel {
  position: absolute; top: 50%; right: 8px; margin-top: -20px; width: 40px; height: 40px; border-radius: 50%;
  border: 0; background: transparent; color: var(--muted); font: 600 20px/1 var(--body); cursor: pointer;
}
.bdel:hover { background: var(--chip); color: var(--tomato); }
.bdel.confirm { width: auto; padding: 0 12px; border-radius: 999px; background: var(--tomato); color: var(--on-accent); font-size: 13px; }
.bdel:focus-visible { outline: 3px solid var(--tomato); outline-offset: 2px; }
.empty { border: 1.5px dashed var(--line); border-radius: 18px; padding: 18px; color: var(--muted); font-size: 15px; }
.saverow { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
button:focus-visible, select:focus-visible { outline: 3px solid var(--tomato); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>

<div class="page">
  <header class="brand">
    <div>
      <h1>Rezept<em>finder</em></h1>
      <p>Gericht eingeben, Wünsche wählen, Rezept bekommen.</p>
    </div>
    <span class="mode" id="mode">Sammlung</span>
  </header>

  <form class="form" id="form" autocomplete="off">
    <div class="field">
      <label class="label" for="q">Was möchtest du kochen?</label>
      <div class="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" name="q" type="search" enterkeyhint="search" maxlength="160" placeholder="z. B. Lasagne, etwas mit Kürbis, schnelles Curry" value="Cremige Gnocchi">
      </div>
      <div class="quick" id="quick" aria-label="Ideen">
        <button type="button">Kürbissuppe</button><button type="button">Linsen-Dal</button><button type="button">Ofengemüse</button><button type="button">Pfannkuchen</button>
      </div>
    </div>

    <div class="row">
      <div class="field">
        <span class="label" id="lblServ">Personen</span>
        <div class="stepper" role="group" aria-labelledby="lblServ">
          <button type="button" id="fMinus" aria-label="Eine Person weniger">−</button>
          <output id="fServ" aria-live="polite">4 Personen</output>
          <button type="button" id="fPlus" aria-label="Eine Person mehr">+</button>
        </div>
      </div>
      <div class="field">
        <label class="label" for="time">Zeit</label>
        <select id="time">
          <option value="">egal</option><option value="20">bis 20 Min</option><option value="30">bis 30 Min</option>
          <option value="45">bis 45 Min</option><option value="60">bis 60 Min</option>
        </select>
      </div>
    </div>

    <div class="field">
      <span class="label" id="lblAll">Unverträglichkeiten</span>
      <div class="chips" id="allergies" role="group" aria-labelledby="lblAll"></div>
    </div>
    <div class="field">
      <span class="label" id="lblDiet">Wünsche</span>
      <div class="chips" id="diets" role="group" aria-labelledby="lblDiet"></div>
    </div>

    <button class="go" id="go" type="submit">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      Passende Gerichte finden
    </button>
  </form>

  <div id="status" class="status" hidden></div>

  <section class="sugg" id="sugg" aria-labelledby="hSugg" hidden>
    <h2 id="hSugg">Vorschläge</h2>
    <p class="sub" id="suggSrc">Ideen von Claude, passend zu deinen Angaben.</p>
    <ul class="slist" id="slist"></ul>
  </section>

  <article class="rec" id="rec" aria-labelledby="rTitle" hidden></article>

  <section class="book" id="book" aria-labelledby="hBook">
    <h2 id="hBook">Meine Rezepte</h2>
    <p class="sub" id="bookSub">Jedes Rezept, das du öffnest, landet hier, sortiert nach Kategorie.</p>
    <div id="bookList"></div>
  </section>
</div>

<script>

  ];

  var LABEL = {};
  ALLERGIES.forEach(function (a) { LABEL[a[0]] = a[1]; });
  LABEL.weichtiere = "Weichtiere"; LABEL.lupine = "Lupine"; LABEL.sulfite = "Sulfite";

  // Eingebaute Sammlung: funktioniert auch ohne Claude.

        { menge: 250, einheit: "g", name: "Kirschtomaten" },

        { menge: 100, einheit: "g", name: "Babyspinat", allergene: ["histamin"] },
        { menge: 50, einheit: "g", name: "Parmesan", hinweis: "frisch gerieben", allergene: ["milcheiweiss", "histamin"] },
        { menge: 1, einheit: "TL", name: "Oregano", hinweis: "getrocknet" },
        { menge: 0.5, einheit: "TL", name: "Zucker" },
        { menge: 1, einheit: "Handvoll", name: "Basilikum", hinweis: "frisch" },
        { menge: null, einheit: "", name: "Salz und Pfeffer" }
      ],
      schritte: [

  function num(v, d) { var n = Number(v); return isFinite(n) && n >= 0 ? n : d; }

    }).join("");
    el.addEventListener("click", function (e) {
      var b = e.target.closest(".chip"); if (!b) return;
      var v = b.getAttribute("data-v"), i = form[key].indexOf(v);

      b.setAttribute("aria-pressed", i < 0);
      save();
    });
  }
  chips($("allergies"), ALLERGIES, "allergies", "");
  chips($("diets"), DIETS, "diets", "diet");
  $("q").value = form.q; $("time").value = form.time;
  function renderFormServ() {
    $("fServ").textContent = form.serv + (form.serv === 1 ? " Person" : " Personen");
    $("fMinus").disabled = form.serv <= 1; $("fPlus").disabled = form.serv >= 12;
  }

  /* ---------- Status ---------- */
  function status(html, kind) {

  }
  function busy(text, withStop) {
    status('<span class="spin" aria-hidden="true"></span><div style="flex:1;min-width:0"><span id="busyTxt">' + esc(text) + '</span><div class="bar"><i id="busyBar"></i></div></div>' +
      (withStop ? '<button type="button" class="btnlink" id="stop">Stopp</button>' : ""));

  }
  function errText(e) {
    var c = e && e.code;
    if (c === "not_granted" || c === "sampling_disabled" || c === "capability_disabled" || c === "not_declared" || c === "capability_removed") return "Claude ist hier nicht freigegeben. Ich nutze die eingebaute Sammlung.";
    if (c === "rate_limited") return "Gerade zu viele Anfragen. Bitte gleich noch einmal versuchen.";
    if (c === "refused") return "Dazu kann ich kein Rezept erstellen. Versuch es mit einem anderen Gericht.";

  /* ---------- Suche ---------- */
  function search() {
    var q = ($("q").value || "").trim();
    if (!q) { status("Gib ein Gericht oder eine Zutat ein.", "warn"); $("q").focus(); return; }

  function localSuggest(q, note) {
    $("suggSrc").textContent = "Aus der eingebauten Sammlung.";
    var words = q.toLowerCase().split(/[^a-zäöüß]+/).filter(function (w) { return w.length > 2; });
    var hits = LIB.map(function (r) {
      var hay = (r.name + " " + r.tags + " " + r.zutaten.map(function (z) { return z.name; }).join(" ")).toLowerCase();
      var score = 0;
      words.forEach(function (w) { if (hay.indexOf(w) > -1) score += 2; else if (w.length > 4 && hay.indexOf(w.slice(0, -2)) > -1) score += 1; });
      var bad = conflicts(r).length;
      if (form.diets.indexOf("vegan") > -1 && !r.vegan) bad++;
      if (form.diets.indexOf("vegetarisch") > -1 && !r.vegetarisch) bad++;
      var total = r.zeit.vorbereitung + r.zeit.kochen + r.zeit.ruhe;
      if (form.time && total > +form.time) bad++;
      return { r: r, score: score - bad * 0.5, bad: bad };
    }).sort(function (a, b) { return b.score - a.score; });
    var any = hits[0].score > 0;
    renderSuggestions(hits.map(function (h) {
      var r = h.r;
      return { name: r.name, beschreibung: r.beschreibung, minuten: r.zeit.vorbereitung + r.zeit.kochen + r.zeit.ruhe, schwierigkeit: r.schwierigkeit,
        passt: h.bad ? "passt nicht ganz zu deinen Angaben" : (h.score > 0 ? "passt zu deiner Suche" : "aus der Sammlung"), farben: r.farben, _lib: r };
    }));
    status(esc(note || "") + (note ? " " : "") + (any ? "Treffer aus der eingebauten Sammlung." : "Kein direkter Treffer in der eingebauten Sammlung. Hier alles, was sie enthält."));
  }

  function aiSuggest(q) {
    ctl = new AbortController();

    var prompt =
      "Du bist ein Sternekoch und berätst Hobbyköche auf Deutsch.\n" +

      "Nennt der Nutzer ein konkretes Gericht, ist Vorschlag 1 genau dieses Gericht (an die Vorgaben angepasst), die anderen sind Varianten oder verwandte Gerichte. " +
      "Nennt er Zutaten oder eine Stimmung, wähle Gerichte, die dazu passen.\n" +
      "Ist die Eingabe kein Essen oder Getränk, gib eine leere Liste zurück und erkläre es in \"hinweis\".\n\n" +

      "schwierigkeit: 1 einfach, 2 mittel, 3 anspruchsvoll. farben: die drei Hauptfarben des fertigen Gerichts als Hex.";
    sample.json(prompt, { signal: my.signal, modelTier: "quick", onText: function (u) { var b = $("busyBar"); if (b) b.style.width = Math.min(95, u.text.length / 9) + "%"; } })

    if (!mcp) { box.hidden = true; return; }
    box.hidden = false;
    var url = savedMap[cur.name];
    if (url) {
      box.innerHTML = '<a class="savebtn done" href="' + esc(safeUrl(url)) + '" target="_blank" rel="noopener noreferrer">✓ Im Rezepte Buch gespeichert ›</a>' +
        '<p class="savemsg">Status: ' + esc(STATUS) + '. <button type="button" class="btnlink" id="saveAgain">Noch einmal speichern</button></p>';
      $("saveAgain").onclick = function () { saveToNotion(true); };
      return;
    }
    box.innerHTML = '<label class="label" for="coverUrl">Foto-Link fürs Rezeptbuch (optional)</label>' +
      '<input id="coverUrl" class="coverin" type="url" inputmode="url" placeholder="https://… Bildadresse, z. B. vom Original kopiert" value="' + esc(cur.bild || "") + '">' +
      '<button type="button" class="savebtn" id="saveBtn">' + ICON_SAVE + "Ins Rezepte Buch speichern</button>" +
      '<p class="savemsg' + (kind === "warn" ? " warn" : "") + '" id="saveMsg">' + (msg || "Legt eine Seite in deinem Notion-Rezeptbuch an, Status „" + esc(STATUS) + "“.") + "</p>";
    $("coverUrl").oninput = function () { cur.bild = this.value.trim(); };
    $("saveBtn").onclick = function () { saveToNotion(false); };
  }
  function saveMsg(html, kind) {
    var m = $("saveMsg"); if (!m) return renderSave(html, kind);
    m.className = "savemsg" + (kind === "warn" ? " warn" : ""); m.innerHTML = html;
  }

  function md(t) { return String(t == null ? "" : t).replace(/[\r\n]+/g, " ").replace(/([*_`#\[\]<>|~])/g, "\\$1").trim(); }
  function notionMarkdown(r) {
    var f = curServ / r.portionen, t = r.zeit, L = [];
    if (r.beschreibung) L.push(md(r.beschreibung), "");
    L.push("**Zeit:** " + (t.vorbereitung + t.kochen + t.ruhe) + " Min (Vorbereitung " + t.vorbereitung + ", Kochen " + t.kochen + ", Ruhezeit " + t.ruhe + ") · **Portionen:** " + curServ +
      " · **Schwierigkeit:** " + ["einfach", "mittel", "anspruchsvoll"][r.schwierigkeit - 1]);

    L.push("", "## Zutaten für " + curServ + (curServ === 1 ? " Portion" : " Portionen"));
    r.zutaten.forEach(function (z) {
      var a = amount(z, f), name = a && a.val > 1 && z.name_plural ? z.name_plural : z.name;
      var al = (z.allergene || []).filter(function (x) { return x !== "histamin" && x !== "fructose"; }).map(function (x) { return LABEL[x] || x; });
      L.push("- " + (a ? "**" + md(a.txt) + "** " : "") + md(name) + (z.hinweis ? " (" + md(z.hinweis) + ")" : "") + (al.length ? " · *" + md(al.join(", ")) + "*" : ""));
    });
    L.push("", "## Zubereitung");
    r.schritte.forEach(function (s, i) { L.push((i + 1) + ". " + (s.titel ? "**" + md(s.titel) + ":** " : "") + md(s.text) + (s.minuten ? " (" + s.minuten + " Min)" : "")); });
    var g = groupAllergens(r);
    L.push("", "## Allergene und Hinweise", "- **Allergene (EU-14):** " + (g.eu.length ? md(g.eu.join(", ")) : "keine der 14 Hauptallergene markiert"));
    if (g.intol.length) L.push("- **Wichtig bei Unverträglichkeiten:** " + md(g.intol.join(", ")));
    (r.hinweise || []).forEach(function (h) { L.push("- **" + md(h.titel) + ":** " + md(h.text)); });
    var n = r.naehrwerte;
    if (n) L.push("", "## Nährwerte pro Portion (ca.)", Math.round(num(n.kcal, 0)) + " kcal · " + Math.round(num(n.eiweiss, 0)) + " g Eiweiß · " + Math.round(num(n.fett, 0)) + " g Fett · " +
      Math.round(num(n.kohlenhydrate, 0)) + " g Kohlenhydrate · " + Math.round(num(n.ballaststoffe, 0)) + " g Ballaststoffe");
    var si = sourceInfo(r);
    L.push("", "## Quelle", "- " + (si.url ? "[" + md(si.label) + "](" + si.url + ")" : md(si.label)));
    if (si.kind !== "original") L.push("- Vergleichsrezepte: [" + md(r.name) + " auf Chefkoch](" + compareUrl(r) + ")");
    L.push("", "---", "*Angelegt mit dem Rezeptfinder" + (r.ki && !r.importiert ? ", Rezept von Claude erstellt, Angaben ohne Gewähr" : "") + ".*");
    return L.join("\n");
  }

  function mcpErr(e, isWrite) {
    var c = e && e.code;
    if (c === "needs_reauth") return "Die Notion-Verbindung ist abgelaufen. Verbinde Notion neu unter claude.ai → Einstellungen → Connectors.";
    if (c === "server_not_connected" || c === "server_not_found") return "Notion ist nicht verbunden. Füge Notion unter claude.ai → Einstellungen → Connectors hinzu.";
    if (c === "selection_required") return "Du hast mehrere Notion-Verbindungen. Wähle in claude.ai aus, welche diese Seite nutzen soll.";
    if (c === "not_in_manifest" || c === "approval_required" || c === "consent_required") return "Der Zugriff auf Notion wurde nicht erlaubt. Tippe erneut auf Speichern und wähle „Erlauben“.";
    if (c === "blocked_by_policy") return "Deine Organisation erlaubt diesen Notion-Zugriff nicht.";
    if (c === "tool_error") return "Notion hat das Anlegen abgelehnt. Hast du Zugriff auf das Rezepte Buch? " + esc(String(e.message || "").slice(0, 160));
    if (isWrite) return 'Unklar, ob die Seite angelegt wurde. Sieh im <a href="' + BOOK_URL + '" target="_blank" rel="noopener noreferrer">Rezepte Buch</a> nach, bevor du es erneut versuchst.';
    return "Notion antwortet gerade nicht. Bitte gleich noch einmal versuchen.";
  }
  function norm(s) { return String(s || "").toLowerCase().replace(/[^a-z0-9äöüß]+/g, " ").trim(); }
  function findUrl(payload) {
    var txt = typeof payload === "string" ? payload : JSON.stringify(payload || "");
    var m = /https:\/\/(?:app\.notion\.com|www\.notion\.so)\/[^\s"'\\)]+/.exec(txt);
    return m ? m[0] : "";
  }

  function saveToNotion(force) {
    if (saving || !cur || !mcp) return;
    var r = cur;
    saving = true;
    var btn = $("saveBtn"); if (btn) btn.disabled = true;
    saveMsg("Prüfe dein Rezepte Buch …");
    var check = force ? Promise.resolve(null) : mcp.callTool(NOTION, "notion-search", { query: r.name, data_source_url: "collection://" + BOOK_DS, page_size: 5 }, { cache: false })
      .then(function (res) {
        var list = (res && res.payload && Array.isArray(res.payload.results)) ? res.payload.results : [];
        var hit = list.filter(function (x) { return norm(x.title) === norm(r.name); })[0];
        return hit || null;
      }, function (e) {
        if (e && /^(needs_reauth|server_not_connected|server_not_found|selection_required|not_in_manifest|approval_required|blocked_by_policy|consent_required)$/.test(e.code)) throw e;
        return null;
      });
    check.then(function (hit) {
      if (hit && cur === r) {
        saving = false;
        var box = $("saveBox");
        box.innerHTML = '<p class="savemsg warn">„' + esc(hit.title) + '“ steht schon in deinem <a href="' + esc(safeUrl(hit.url)) + '" target="_blank" rel="noopener noreferrer">Rezepte Buch</a>.</p>' +
          '<div class="saverow"><button type="button" class="savebtn ghost" id="dupNo">Abbrechen</button><button type="button" class="savebtn" id="dupYes">Trotzdem anlegen</button></div>';
        $("dupNo").onclick = function () { renderSave(); };
        $("dupYes").onclick = function () { saveToNotion(true); };
        return;
      }
      saveMsg("Lege die Seite in Notion an …");
      return mcp.callTool(NOTION, "notion-create-pages", {
        parent: { type: "data_source_id", data_source_id: BOOK_DS },
        pages: [(function () {
          var pg = { properties: { Name: r.name, Status: STATUS }, icon: r.emoji || "🍽️", content: notionMarkdown(r) };
          if (/^https:\/\/[^\s"<>]+$/i.test(r.bild || "")) pg.cover = r.bild;
          return pg;
        })()]
      }).then(function (res) {
        saving = false;
        remember(r.name, findUrl(res && (res.payload || res.content)));
        if (cur === r) renderSave();
      });
    }).catch(function (e) {
      saving = false;
      if (cur !== r) return;
      renderSave(mcpErr(e, e && e._write !== false), "warn");
    });
  }

  /* ---------- Meine Rezepte (nach Kategorie) ---------- */
  var KATS = ["Vorspeisen", "Pasta", "Fleisch", "Fisch", "Vegetarisch", "Vegan", "Dessert", "Backen/Kuchen"];
  var KAT_WORDS = [
    ["Backen/Kuchen", /kuchen|torte|muffin|brot|brötchen|keks|plätzchen|cookie|strudel|tarte|gebäck|waffel/],
    ["Dessert", /dessert|pudding|mousse|tiramisu|panna|creme brulee|crème|eis\b|sorbet|kompott|pfannkuchen|crêpe|crepe|kaiserschmarrn/],
    ["Fisch", /fisch|lachs|thunfisch|forelle|kabeljau|dorsch|garnele|shrimp|scampi|muschel|tintenfisch|zander|hering|sardine/],
    ["Fleisch", /fleisch|hähnchen|huhn|hühn|pute|rind|schwein|hack|speck|schinken|wurst|lamm|kalb|wild|hirsch|reh|gulasch|braten|schnitzel|steak|ente|bacon/],
    ["Pasta", /pasta|spaghetti|nudel|lasagne|gnocchi|penne|tagliatelle|ravioli|tortellini|maccheroni|linguine|spätzle/],
    ["Vorspeisen", /vorspeise|suppe|salat|bruschetta|carpaccio|antipasti|dip|häppchen/]
  ];
  function guessKat(r) {
    if (KATS.indexOf(r.kategorie) > -1) return r.kategorie;
    var hay = (r.name + " " + r.zutaten.map(function (z) { return z.name; }).join(" ")).toLowerCase();
    var nameOnly = String(r.name).toLowerCase();
    for (var i = 0; i < KAT_WORDS.length; i++) if (KAT_WORDS[i][1].test(nameOnly)) return KAT_WORDS[i][0];
    for (i = 0; i < KAT_WORDS.length; i++) if (KAT_WORDS[i][0] === "Fisch" || KAT_WORDS[i][0] === "Fleisch") if (KAT_WORDS[i][1].test(hay)) return KAT_WORDS[i][0];
    var animal = r.zutaten.some(function (z) { return (z.allergene || []).some(function (a) { return a === "laktose" || a === "milcheiweiss" || a === "ei"; }) || /honig|butter|käse|sahne|joghurt|quark/i.test(z.name); });
    return r.vegan || !animal ? "Vegan" : "Vegetarisch";
  }
  function slug(n) {
    var t = String(n || "").toLowerCase().replace(/ä/g, "ae").replace(/ö/g, "oe").replace(/ü/g, "ue").replace(/ß/g, "ss");
    return t.replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "").slice(0, 80) || "rezept";
  }
  var book = {}, bookDb = null, bookUid = null, armed = null;
  try { book = JSON.parse(localStorage.getItem("rezeptfinder-buch") || "{}") || {}; } catch (e) { book = {}; }
  function keepLocal() { try { localStorage.setItem("rezeptfinder-buch", JSON.stringify(book)); } catch (e) {} }
  function bookCol() { return bookDb && bookUid ? bookDb.collection("data/users/" + bookUid) : null; }

  function addToBook(r) {
    var rec = JSON.parse(JSON.stringify(r));
    rec.kategorie = guessKat(r);
    rec.serv = curServ;
    rec.savedAt = Date.now();
    var id = slug(r.name);
    book[id] = rec;
    keepLocal(); renderBook();
    var col = bookCol();
    if (col) col.doc(id).set(rec).catch(function (e) { bookNote(e); });
  }
  function removeFromBook(id) {
    delete book[id]; keepLocal(); renderBook();
    var col = bookCol();
    if (col) col.doc(id).delete().catch(function (e) { bookNote(e); });
  }
  function bookNote(e) {
    var c = e && e.code;
    $("bookSub").textContent = c === "quota_exceeded" ? "Die Sammlung ist voll. Lösche alte Rezepte, damit neue dazukommen."
      : "Die Sammlung ist gerade nur auf diesem Gerät gespeichert.";
  }
  function renderBook() {
    var ids = Object.keys(book);
    if (!ids.length) {
      $("bookList").innerHTML = '<p class="empty">Noch keine Rezepte. Such ein Gericht und öffne ein Rezept, dann erscheint es hier in seiner Kategorie.</p>';
      return;
    }
    var groups = {};
    ids.forEach(function (id) { var k = guessKat(book[id]); (groups[k] = groups[k] || []).push(id); });
    $("bookList").innerHTML = KATS.filter(function (k) { return groups[k]; }).map(function (k) {
      var list = groups[k].sort(function (a, b) { return (book[b].savedAt || 0) - (book[a].savedAt || 0); });
      return '<div class="kat"><h3>' + esc(k) + "<span>" + list.length + "</span></h3>" + '<ul class="slist">' + list.map(function (id) {
        var r = book[id], t = r.zeit || {}, total = num(t.vorbereitung, 0) + num(t.kochen, 0) + num(t.ruhe, 0);
        var g = groupAllergens(r);
        return '<li class="bitem"><button type="button" class="scard" data-open="' + esc(id) + '">' +
          '<canvas width="128" height="128" data-b="' + esc(id) + '" aria-hidden="true"></canvas>' +
          '<span style="min-width:0"><b>' + (r.emoji ? esc(r.emoji) + " " : "") + esc(r.name) + "</b>" +
          '<span class="meta"><span>' + total + " Min</span><span>" + ["einfach", "mittel", "anspruchsvoll"][(r.schwierigkeit || 1) - 1] + "</span>" +
          (g.eu.length ? '<span>' + esc(g.eu.join(", ")) + "</span>" : '<span class="why">ohne Hauptallergene</span>') + "</span></span></button>" +
          '<button type="button" class="bdel" data-del="' + esc(id) + '" aria-label="' + esc(r.name) + ' aus Meine Rezepte entfernen">×</button></li>';
      }).join("") + "</ul></div>";
    }).join("");
    $("bookList").querySelectorAll("canvas[data-b]").forEach(function (c) { var r = book[c.getAttribute("data-b")]; drawPlate(c, r.farben, r.name, true); });
  }
  $("bookList").addEventListener("click", function (e) {
    var del = e.target.closest(".bdel");
    if (del) {
      var id = del.getAttribute("data-del");
      if (armed === id) { armed = null; removeFromBook(id); return; }
      armed = id; renderBook();
      var b = $("bookList").querySelector('.bdel[data-del="' + id + '"]');
      if (b) { b.classList.add("confirm"); b.textContent = "Entfernen?"; b.focus(); }
      return;
    }
    var open = e.target.closest("[data-open]");
    if (open) { armed = null; var r = book[open.getAttribute("data-open")]; if (r) show(JSON.parse(JSON.stringify(r)), r.serv || r.portionen); }
  });

  function startBook() {
    if (!(window.claude && window.claude.use)) return;
    Promise.all([window.claude.use("db"), window.claude.use("user")]).then(function (res) {
      var db = res[0], user = res[1];
      if (!db || !user) return;
      return user.id().then(function (id) {
        if (!id) return;
        bookDb = db; bookUid = id;
        var first = true, timer = setTimeout(function () { $("bookSub").textContent = "Die gespeicherte Sammlung lädt noch. Angezeigt wird der Stand auf diesem Gerät."; }, 10000);
        bookCol().onSnapshot(function (snap) {
          if (!snap.metadata.fromCache) clearTimeout(timer);
          var remote = {};
          snap.docs.forEach(function (d) { if (d.exists) remote[d.id] = d.data(); });
          if (first && !snap.metadata.fromCache) {
            first = false;
            // Einmalig: Rezepte, die bisher nur auf diesem Gerät lagen, in die Sammlung übernehmen.
            Object.keys(book).forEach(function (k) { if (!remote[k]) { remote[k] = book[k]; bookCol().doc(k).set(JSON.parse(JSON.stringify(book[k]))).catch(function () {}); } });
            $("bookSub").textContent = "Jedes Rezept, das du öffnest, landet hier, sortiert nach Kategorie.";
          }
          book = JSON.parse(JSON.stringify(remote)); keepLocal(); renderBook();
        }, function (e) { clearTimeout(timer); bookDb = null; bookNote(e); });
      });
    }).catch(function () {});
  }

  function setMode() {
    var m = $("mode");
    m.textContent = sample ? "Mit Claude" : "Sammlung";
    m.className = "mode" + (sample ? " ai" : "");
  }
  // Startzustand: zuletzt angesehenes Rezept oder das Beispielrezept.
  show(cur || JSON.parse(JSON.stringify(LIB[0])), cur ? curServ : 4, true);
  localSuggest(form.q);
  status("");
  renderBook();
  startBook();

  if (window.claude && window.claude.use) {
    window.claude.use("sample").then(function (s) { sample = s || null; setMode(); }).catch(function () { sample = null; setMode(); });
    window.claude.use("mcp").then(function (m) { mcp = m || null; renderSave(); }).catch(function () { mcp = null; });
  }
})();
</script>
